[project]
name = "atrium"
version = "0.1.0"
description = "Build-your-own AI agent teams with an orchestrator, selective RAG, model routing and full observability."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "litellm>=1.60",
    "langfuse>=3.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdf>=5.0",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
